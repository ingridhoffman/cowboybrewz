<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cowboy Brewz &amp; Grill</title>
  <meta name="description" content="Cowboy Brewz is back! See y'all soon. Find us at upcoming rodeos and fairs across Washington.">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="logo.png">

  <!-- Open Graph / social preview -->
  <meta property="og:title" content="Cowboy Brewz is back!">
  <meta property="og:description" content="See y'all soon. Catch us at upcoming rodeos and fairs across Washington.">
  <meta property="og:image" content="logo.png">
  <meta property="og:type" content="website">

  <!-- Hero font: Rokkitt -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rokkitt:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

  <style>
    :root {
      --brown-dark:   #3b2a1e;
      --brown:        #6b4423;
      --brown-mid:    #7a4f2a;
      --tan:          #b8863b;
      --cream:        #f6efe2;
      --cream-deep:   #ece0cb;
      --card:         #fffaf0;
      --ink:          #2e2118;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse at top, #fbf6ec 0%, var(--cream) 45%, var(--cream-deep) 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: clamp(1.5rem, 4vw, 3rem) 1.25rem;
      line-height: 1.5;
    }

    /* ---------- Hero ---------- */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 720px;
      width: 100%;
    }

    .logo {
      width: clamp(190px, 42vw, 300px);
      height: auto;
      filter: drop-shadow(0 6px 14px rgba(59, 42, 30, 0.22));
    }

    .headline {
      font-family: "Rokkitt", Georgia, serif;
      font-weight: 400;
      font-size: clamp(1.9rem, 6.2vw, 3.4rem);
      line-height: 1.08;
      color: var(--brown-dark);
      margin-top: clamp(0.75rem, 2vw, 1.25rem);
      letter-spacing: 0.5px;
    }

    .headline .soon {
      display: block;
      font-weight: 500;
      font-style: italic;
      font-size: 0.62em;
      color: var(--brown-mid);
      margin-top: 0.35rem;
    }

    .rule {
      width: 120px;
      height: 3px;
      margin: clamp(1.5rem, 3.5vw, 2.25rem) auto clamp(0.5rem, 2vw, 1rem);
      border: none;
      background: linear-gradient(90deg, transparent, var(--tan), transparent);
    }

    /* ---------- Events ---------- */
    .events-label {
      font-family: "Rokkitt", Georgia, serif;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: clamp(0.85rem, 2.4vw, 1rem);
      color: var(--brown);
      margin-bottom: clamp(1rem, 2.5vw, 1.5rem);
    }

    .events {
      display: flex;
      flex-wrap: wrap;
      gap: clamp(1rem, 2.5vw, 1.5rem);
      justify-content: center;
      width: 100%;
      max-width: 760px;
    }

    .event {
      background: var(--card);
      border: 1px solid #e3d4b6;
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(59, 42, 30, 0.10);
      padding: clamp(1.25rem, 3vw, 1.75rem);
      flex: 1 1 300px;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .event .date {
      display: inline-block;
      background: var(--brown-dark);
      color: var(--cream);
      font-family: "Rokkitt", Georgia, serif;
      font-weight: 700;
      font-size: clamp(0.9rem, 2.4vw, 1.05rem);
      letter-spacing: 0.5px;
      padding: 0.4rem 0.9rem;
      border-radius: 999px;
    }

    .event .name {
      font-family: "Rokkitt", Georgia, serif;
      font-weight: 700;
      font-size: clamp(1.15rem, 3vw, 1.4rem);
      color: var(--brown-dark);
      line-height: 1.15;
    }

    .event .location {
      font-size: clamp(0.9rem, 2.4vw, 1rem);
      color: var(--brown-mid);
    }

    .event .location::before {
      content: "\1F4CD";
      margin-right: 0.3rem;
    }

    /* ---------- Booking CTA ---------- */
    .booking {
      margin-top: clamp(1.75rem, 4vw, 2.75rem);
    }

    .booking a {
      display: inline-block;
      font-family: "Rokkitt", Georgia, serif;
      font-weight: 700;
      font-size: clamp(1rem, 2.6vw, 1.2rem);
      letter-spacing: 0.5px;
      color: var(--cream);
      background: var(--brown);
      text-decoration: none;
      padding: 0.7rem 1.6rem;
      border-radius: 999px;
      box-shadow: 0 4px 14px rgba(59, 42, 30, 0.20);
      transition: background 0.15s ease, transform 0.15s ease;
    }

    .booking a:hover,
    .booking a:focus-visible {
      background: var(--brown-dark);
      transform: translateY(-1px);
    }

    /* ---------- Footer ---------- */
    footer {
      margin-top: auto;
      padding-top: clamp(2rem, 5vw, 3.5rem);
      font-size: 0.85rem;
      color: var(--brown-mid);
    }
  </style>
</head>
<body>

  <main class="hero">
    <img class="logo" src="logo.png" alt="Cowboy Brewz &amp; Grill logo">

    <h1 class="headline">
      Cowboy Brewz is back!
      <span class="soon">See y'all soon&hellip;</span>
    </h1>

    <hr class="rule">

    <p class="events-label">Catch us at</p>

    <section class="events" aria-label="Upcoming events">
      <article class="event">
        <span class="date">Aug 20&ndash;22, 2026</span>
        <span class="name">Lincoln County Fair &amp; Rodeo</span>
        <span class="location">Davenport, WA</span>
      </article>

      <article class="event">
        <span class="date">Sep 4&ndash;6, 2026</span>
        <span class="name">Ritzville Rodeo &amp; Mounted Shooters</span>
        <span class="location">Ritzville, WA</span>
      </article>
    </section>

    <p class="booking">
      <a href="mailto:rdean@cowboybrewz.com?subject=Booking%20inquiry%20%E2%80%94%20Cowboy%20Brewz">Book us for your next event</a>
    </p>
  </main>

  <footer>
    &copy; <span id="year">2026</span> Cowboy Brewz &amp; Grill
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>

</body>
</html>
